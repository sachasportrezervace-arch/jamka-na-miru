<style>
@font-face { font-family: "Baloo 2"; src: url(fonts/baloo2-800.woff2) format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Baloo 2"; src: url(fonts/baloo2-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: Onest; src: url(fonts/onest-400-latin.woff2) format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0000-00FF; }
@font-face { font-family: Onest; src: url(fonts/onest-400-latin-ext.woff2) format("woff2"); font-weight: 400; font-display: swap; unicode-range: U+0100-024F; }
@font-face { font-family: Onest; src: url(fonts/onest-600-latin.woff2) format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0000-00FF; }
@font-face { font-family: Onest; src: url(fonts/onest-600-latin-ext.woff2) format("woff2"); font-weight: 600; font-display: swap; unicode-range: U+0100-024F; }
@font-face { font-family: Onest; src: url(fonts/onest-700-latin.woff2) format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+0000-00FF; }
@font-face { font-family: Onest; src: url(fonts/onest-700-latin-ext.woff2) format("woff2"); font-weight: 700; font-display: swap; unicode-range: U+0100-024F; }
:root {
  --ink: #1E1B2E; --mut: #6B6880; --paper: #FFFFFF; --cream: #FFF8EC; --x: #FF6A3D; --o: #3E8BFF; --sun: #FFD23F; --ok: #2E9E5B; --bad: #E5484D;
  --sh: 0 2px 0 rgba(30,27,46,.10), 0 8px 24px rgba(30,27,46,.10);
  --r: 18px; --safeT: env(safe-area-inset-top, 0px); --safeB: env(safe-area-inset-bottom, 0px);
  --disp: "Baloo 2", "Onest", system-ui, sans-serif; --ui: Onest, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #CFEBD9; color: var(--ink); font: 15px/1.35 var(--ui); }
body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.bi { width: 26px; height: 26px; flex: none; display: block; }

/* ---------- horní lišta ---------- */
#topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safeT) + 10px) 12px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; pointer-events: none; }
.chip { pointer-events: auto; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; background: var(--paper); border-radius: 16px; padding: 7px 12px 7px 8px; box-shadow: var(--sh); min-width: 0; max-width: 260px; transition: transform .2s, box-shadow .2s; }
.chip .bi { grid-row: 1 / 3; width: 30px; height: 30px; transition: transform .2s; }
.chip.turn .bi { transform: scale(1.1); }
.chip .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.chip .nm i { font-style: normal; font-weight: 600; font-size: 11px; color: var(--mut); background: #F1EEF6; border-radius: 6px; padding: 1px 5px; margin-left: 2px; vertical-align: 1px; }
.chip .tot { grid-row: 1 / 3; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.chip .tot b { font: 800 24px/1 var(--disp); }
.chip .tot em { font-style: normal; font-weight: 700; font-size: 11px; color: var(--mut); margin-top: 2px; }
.chip .cur { font-size: 12px; color: var(--mut); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chipO { justify-self: end; }
.chip.turn { box-shadow: 0 0 0 3px var(--pc), var(--sh); transform: translateY(1px); }
#chipX { --pc: var(--x); } #chipO { --pc: var(--o); }
#holePill { pointer-events: auto; background: var(--ink); color: #fff; border-radius: 14px; padding: 7px 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--sh); white-space: nowrap; }
#holePill b { font: 800 18px/1 var(--disp); }
#holePill b span { opacity: .6; font: inherit; }          /* „/6“ stejným písmem a řezem jako „Jamka 1“ */
#holePill .par { font-weight: 700; font-size: 13px; opacity: .9; }
#holePill .mod { font-weight: 700; font-size: 12px; background: var(--sun); color: var(--ink); border-radius: 8px; padding: 2px 7px; }

/* ---------- nabídka (skórkarta, zvuk, celá obrazovka) ---------- */
#bMenu { position: absolute; right: 12px; top: calc(var(--safeT) + 70px); }
.ib { width: 40px; height: 40px; border-radius: 13px; background: var(--paper); box-shadow: var(--sh); display: grid; place-items: center; }
.ib svg { width: 21px; height: 21px; }
#bMenu[aria-expanded="true"] { background: var(--ink); color: #fff; }
#menu { position: absolute; right: 12px; top: calc(var(--safeT) + 116px); background: var(--paper); border-radius: 16px; box-shadow: var(--sh); padding: 6px; min-width: 214px; display: flex; flex-direction: column; z-index: 4; }
#menu[hidden] { display: none; }
#menu .mi { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 11px; font-weight: 700; font-size: 14.5px; text-align: left; }
#menu .mi:hover, #menu .mi:active { background: #F1EEF6; }
#menu .mi[hidden] { display: none; }
#menu .mi svg { width: 21px; height: 21px; flex: none; }
#bCam { position: absolute; right: 12px; display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px 0 11px; border-radius: 14px; background: var(--paper); box-shadow: var(--sh); font-weight: 700; font-size: 14px; bottom: calc(var(--safeB) + 12px + var(--dockH, 0px)); }
#bCam svg { width: 20px; height: 20px; }
#bCam[hidden] { display: none; }

/* ---------- spodní lišta ---------- */
#dock { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safeB) + 12px); width: min(560px, calc(100% - 24px)); background: var(--paper); border-radius: 20px; box-shadow: var(--sh); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; transition: opacity .2s; }
#dock:empty, #dock.quiet { opacity: 0; pointer-events: none; }
#dock .say { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#dock .say b { font: 800 19px/1.15 var(--disp); }
#dock .say span { color: var(--mut); font-size: 13.5px; }
.aimrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.aimrow .say { flex: 1; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.tc { text-align: left; background: #F7F5FA; border-radius: 14px; padding: 9px 10px; display: grid; grid-template-columns: 38px 1fr; column-gap: 8px; align-items: center; border: 2px solid transparent; }
.tc svg { width: 38px; height: 38px; grid-row: 1 / 3; }
.tc b { font-weight: 700; font-size: 14px; }
.tc span { font-size: 11.5px; color: var(--mut); line-height: 1.25; }
.tc.on { background: var(--sun); border-color: var(--ink); }
.tc.on span { color: rgba(30,27,46,.75); }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; background: var(--sun); color: var(--ink); font-weight: 700; font-size: 16px; box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 var(--ink); width: 100%; }
.btn.alt { background: #F1EEF6; color: var(--ink); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--ink), 0 1px 0 var(--ink); }
.btn.alt:active:not(:disabled) { box-shadow: none; }

/* síla úderu (v panelu) */
#pow { flex: none; display: flex; align-items: center; gap: 6px; opacity: .28; transition: opacity .12s; }
#pow.on { opacity: 1; }
#pow i { display: block; width: 76px; height: 9px; border-radius: 5px; background: #E6E2EE; overflow: hidden; }
#pow i::after { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, #7CE38B, var(--sun) 70%, #FF6A3D); }
#pow b { font: 800 16px/1 var(--disp); min-width: 42px; text-align: right; }

/* výsledek jamky v panelu */
.res { display: flex; flex-direction: column; gap: 6px; }
.res .rh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.res .rh b { font: 800 19px/1.15 var(--disp); }
.res .rh span { color: var(--mut); font-weight: 700; font-size: 13px; }
.res .rl { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 8px; align-items: center; padding: 4px 10px 4px 6px; border-radius: 12px; background: #F7F5FA; }
.res .rl.w { background: #FFF0B0; }
.res .rl .bi { width: 30px; height: 30px; }
.res .rl span { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .rl b { font: 800 24px/1 var(--disp); }
.res .rl em { font-style: normal; font-weight: 700; font-size: 13px; color: var(--mut); min-width: 44px; text-align: right; }

/* ---------- uvedení jamky ---------- */
#intro { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%) scale(.92); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
#intro.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.hi { background: var(--paper); border-radius: 22px; box-shadow: var(--sh); padding: 16px 22px; text-align: center; min-width: 230px; max-width: min(340px, 86vw); }
.hi .no { display: block; font-weight: 700; color: var(--mut); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.hi > b { display: block; font: 800 40px/1 var(--disp); margin: 2px 0; }
.hi .th { font-weight: 600; color: var(--mut); }
.hi p { margin: 8px 0 0; font-size: 14px; }
.hi p b { font-weight: 700; }

/* ---------- skórkarta ---------- */
#card { display: none; }
body.cardOpen #card { display: block; position: absolute; right: 12px; top: calc(var(--safeT) + 116px); width: min(380px, calc(100% - 24px)); background: var(--paper); border-radius: 18px; box-shadow: var(--sh); padding: 8px; z-index: 4; }
#card table, .cardwrap table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
#card th, #card td, .cardwrap th, .cardwrap td { padding: 4px 3px; text-align: center; }
#card thead td, .cardwrap thead td { color: var(--mut); font-weight: 700; font-size: 11px; }
#card tbody th, .cardwrap tbody th { text-align: left; font-weight: 700; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
#card th .bi, .cardwrap th .bi { width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 6px; }
#card th span, .cardwrap th span { vertical-align: middle; }
.r-par td, .r-par th { color: var(--mut); font-weight: 600; }
td.now { background: #FFF6D6; }
td.eso, td.pod { color: var(--ok); font-weight: 800; }
td.nad { color: var(--bad); font-weight: 700; }
td i { font-style: normal; color: var(--mut); }
td.sum { font-weight: 800; font-family: var(--disp); font-size: 15px; }

/* ---------- menu obrazovky ---------- */
#view { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(var(--safeT) + 16px) 16px calc(var(--safeB) + 16px); background: rgba(30, 33, 44, .46); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); overflow-y: auto; }
#view[hidden] { display: none; }
.panel { width: min(420px, 100%); background: var(--paper); border-radius: 26px; box-shadow: var(--sh); padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.panel h1 { font: 800 34px/1.05 var(--disp); margin: 0; }
.panel h2 { font: 800 26px/1.1 var(--disp); margin: 0; }
.panel p { margin: 0; }
.panel .lead { color: var(--mut); font-size: 15px; }
.panel label { font-weight: 700; font-size: 13px; margin-top: 4px; }
.panel label i { font-style: normal; color: var(--mut); font-weight: 600; }
.panel input { font: 600 17px var(--ui); padding: 12px 14px; border-radius: 13px; border: 2px solid #E6E2EE; outline: none; background: #FBFAFD; color: var(--ink); width: 100%; }
.panel input:focus { border-color: var(--ink); }
.logo { display: flex; gap: 0; }
.logo .bi { width: 52px; height: 52px; }
.logo .bi + .bi { margin-left: -12px; }
.how { margin: 2px 0 4px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.how li { padding-left: 18px; position: relative; }
.how li::before { content: ""; position: absolute; left: 3px; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 2px var(--ink); }
.msg { background: #F7F5FA; border-radius: 13px; padding: 12px; font-size: 14px; user-select: text; -webkit-user-select: text; }
.endcard { display: flex; flex-direction: column; gap: 10px; text-align: center; align-items: center; }
.endpair { display: flex; align-items: flex-end; justify-content: center; gap: 18px; }
.endpair .who { display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; font-size: 13px; color: var(--mut); }
.endpair .who .bi { width: 74px; height: 74px; }
.endpair .who.lose .bi { width: 56px; height: 56px; opacity: .92; }
.endpair .who.win { color: var(--ink); }
.endpair .who.win .bi { animation: hop .9s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@media (prefers-reduced-motion: reduce) { .endpair .who.win .bi { animation: none; } }
.endcard .score { font: 800 22px/1.1 var(--disp); }
.c-x { color: var(--x); } .c-o { color: var(--o); }
.endcard .ser { color: var(--mut); font-weight: 700; }
.cardwrap { width: 100%; background: #FBFAFD; border-radius: 14px; padding: 6px; }
.titles { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.titles li { background: #F7F5FA; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; border-left: 5px solid currentColor; }
.titles li b { font-weight: 800; } .titles li span { color: var(--mut); font-size: 13px; }
.wait { color: var(--mut); font-weight: 600; }

#toast { position: absolute; left: 50%; top: calc(var(--safeT) + 64px); transform: translate(-50%, -8px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; max-width: min(420px, 90vw); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#net { position: absolute; left: 12px; bottom: calc(var(--safeB) + 12px); background: var(--bad); color: #fff; font-weight: 700; font-size: 12px; padding: 5px 10px; border-radius: 10px; }
#net[hidden] { display: none; }
#iosHint { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safeB) + 12px); background: var(--ink); color: #fff; border-radius: 16px; padding: 12px 44px 12px 14px; font-size: 13.5px; z-index: 6; }
#iosHint[hidden], body:not(.menu) #iosHint { display: none; }
#iosHintX { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.14); color: #fff; font-size: 18px; }
body.menu #topbar, body.menu #bMenu, body.menu #menu, body.menu #card, body.menu #dock, body.menu #bCam { visibility: hidden; }

/* ---------- desktop: štítky a pilulka jamky ~1,3× větší (na mobilu se nic nemění) ---------- */
@media (min-width: 561px) and (min-height: 501px) {
  #topbar { padding: calc(var(--safeT) + 12px) 16px 0; }
  .chip { border-radius: 20px; padding: 9px 16px 9px 11px; column-gap: 11px; max-width: 340px; }
  .chip .bi { width: 40px; height: 40px; }
  .chip .nm { font-size: 18px; }
  .chip .nm i { font-size: 14px; border-radius: 8px; padding: 1px 7px; }
  .chip .tot b { font-size: 31px; }
  .chip .tot em { font-size: 14px; margin-top: 3px; }
  .chip .cur { font-size: 15.5px; }
  #holePill { border-radius: 18px; padding: 9px 18px; gap: 13px; }
  #holePill b { font-size: 23px; }
  #holePill .par { font-size: 17px; }
  #holePill .mod { font-size: 15.5px; border-radius: 10px; padding: 3px 9px; }
  #bMenu { right: 16px; top: calc(var(--safeT) + 92px); }
  #menu, body.cardOpen #card { right: 16px; top: calc(var(--safeT) + 140px); }
}

/* ---------- mobil (iPhone na výšku): štítky nejvýš ~48 px, jméno + součet ---------- */
@media (max-width: 560px) {
  #topbar { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; padding-left: 10px; padding-right: 10px; }
  #holePill { grid-column: 1 / 3; grid-row: 2; justify-self: center; padding: 5px 12px; }
  #chipX { grid-row: 1; grid-column: 1; } #chipO { grid-row: 1; grid-column: 2; }
  .chip { padding: 5px 10px 5px 6px; max-width: none; grid-template-rows: auto; max-height: 48px; }
  .chip .bi { width: 26px; height: 26px; grid-row: 1; }
  .chip .nm { grid-row: 1; font-size: 14px; }
  .chip .tot { grid-row: 1; }
  .chip .cur { display: none; }
  .chip .tot b { font-size: 21px; }
  #bMenu { right: 10px; top: calc(var(--safeT) + 60px); width: 38px; height: 38px; }
  #menu, body.cardOpen #card { right: 10px; top: calc(var(--safeT) + 104px); }
  body.cardOpen #card { left: 10px; width: auto; }
  #dock { width: calc(100% - 20px); bottom: calc(var(--safeB) + 10px); padding: 11px 12px; }
  #bCam { right: 10px; }
  .cards { grid-template-columns: 1fr 1fr; gap: 6px; }
  .cards .tc:last-child:nth-child(odd) { grid-column: 1 / 3; }
  .tc { padding: 7px 8px; grid-template-columns: 30px 1fr; column-gap: 6px; }
  .tc svg { width: 30px; height: 30px; }
  .tc span { font-size: 11px; }
  #pow i { width: 58px; }
  #pow b { min-width: 38px; font-size: 15px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #dock { width: min(420px, 46vw); left: auto; right: 12px; transform: none; bottom: calc(var(--safeB) + 8px); max-height: calc(100% - 16px); overflow-y: auto; padding: 9px 11px; gap: 7px; }
  .cards { grid-template-columns: 1fr 1fr; gap: 6px; }
  .cards .tc:last-child:nth-child(odd) { grid-column: 1 / 3; }
  .tc { padding: 6px 7px; grid-template-columns: 28px 1fr; column-gap: 6px; }
  .tc svg { width: 28px; height: 28px; }
  .tc span { font-size: 10.5px; }
  .btn { min-height: 42px; }
  #topbar { padding-top: 6px; }
  #bMenu { right: auto; left: 12px; top: 62px; width: 38px; height: 38px; }
  #menu, body.cardOpen #card { right: auto; left: 12px; top: 106px; }
  body.cardOpen #card { width: min(380px, 50vw); }
  #bCam { right: auto; left: 12px; bottom: 10px; }
}
</style>

</div>

  <button class="mi" id="bSound" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><span>Zvuk zapnutý</span></button>
  <button class="mi" id="bFs" hidden role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg><span>Celá obrazovka</span></button>
</div>
<div id="card"></div>
