<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maketa Herny (host pro tests/herna.cjs)</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; }
  #lista { height: 51px; color: #fff; font: 14px/51px system-ui; padding: 0 12px; }
  #f { display: block; width: 100%; height: calc(100% - 51px); border: 0; background: #fff; }
</style>
</head>
<body>
<div id="lista">Herna (maketa): lišta 51 px nad iframe</div>
<iframe id="f" allow="fullscreen"></iframe>
<script>
  // Plní roli Herny: otevře hru v iframe a sbírá zprávy podle protokolu (jen z vlastního iframe a jen objekty s herna:1).
  window.__msgs = [];
  var f = document.getElementById("f");
  addEventListener("message", function (e) { if (e.source === f.contentWindow && e.data && e.data.herna === 1) window.__msgs.push(e.data); });
  f.src = new URLSearchParams(location.search).get("g");
</script>
</body>
</html>
